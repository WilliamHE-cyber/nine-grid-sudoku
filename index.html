<!DOCTYPE html>
<html lang="en" data-theme="light" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nine Grid · Sudoku</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb" id="themeColorMeta">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nine Grid">
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --grid-line: #cbd5e1; --grid-bold: #334155;
    --text: #1e293b; --muted: #64748b; --given: #1e293b; --user: #2563eb;
    --error: #dc2626; --sel: #bfdbfe; --rel: #e8f0fe; --same: #fde68a;
    --dup: #fca5a5; --accent: #2563eb; --btn: #eef2ff; --btn-text: #1e293b;
    --note: #94a3b8;
  }
  html[data-theme="dark"] {
    --bg: #0f172a; --panel: #1e293b; --grid-line: #475569; --grid-bold: #cbd5e1;
    --text: #e2e8f0; --muted: #94a3b8; --given: #e2e8f0; --user: #60a5fa;
    --error: #f87171; --sel: #1e3a8a; --rel: #172554; --same: #854d0e;
    --dup: #7f1d1d; --accent: #60a5fa; --btn: #334155; --btn-text: #e2e8f0;
    --note: #94a3b8;
  }
  html[data-theme="night"] {
    --bg: #000000; --panel: #0a0a0a; --grid-line: #333333; --grid-bold: #555555;
    --text: #e8e8e8; --muted: #777777; --given: #e8e8e8; --user: #5b9bd5;
    --error: #f06060; --sel: #1a2a3a; --rel: #111111; --same: #2a2510;
    --dup: #3a1515; --accent: #5b9bd5; --btn: #1a1a1a; --btn-text: #d0d0d0;
    --note: #666666;
  }
  html[data-theme="sepia"] {
    --bg: #f5ecd7; --panel: #fbf6ea; --grid-line: #d6c7a1; --grid-bold: #8a7350;
    --text: #5b4636; --muted: #9c8466; --given: #5b4636; --user: #b45309;
    --error: #b91c1c; --sel: #e7d3a8; --rel: #f0e4c8; --same: #e8c87a;
    --dup: #e0a9a9; --accent: #b45309; --btn: #efe2c4; --btn-text: #5b4636;
    --note: #9c8466;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; justify-content: center; padding: 12px;
  }
  .app { width: 100%; max-width: 480px; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  header .title-area { text-align: left; }
  header h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: 1px; }
  header .sub { font-size: 12px; color: var(--muted); }
  .lang-btn {
    padding: 6px 12px; border: 1px solid var(--grid-line); border-radius: 16px;
    background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer;
    font-weight: 600;
  }

  .hud {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel); border-radius: 12px; padding: 8px 12px;
    margin: 8px 0; font-size: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .hud .stat b { color: var(--accent); }
  .hud .mistakes.bad b { color: var(--error); }

  .diffbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .diffbar button {
    flex: 1 1 auto; min-width: 56px; padding: 7px 4px; border: none; border-radius: 8px;
    background: var(--btn); color: var(--btn-text); font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .diffbar button.active { background: var(--accent); color: #fff; }

  .board {
    display: grid; grid-template-columns: repeat(9, 1fr); aspect-ratio: 1 / 1;
    background: var(--grid-bold); border: 3px solid var(--grid-bold); border-radius: 8px;
    overflow: hidden; user-select: none; touch-action: manipulation;
  }
  .cell {
    position: relative; background: var(--panel); border: 1px solid var(--grid-line);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(22px, 7vw, 34px); font-weight: 600; cursor: pointer;
  }
  /* 3x3 宫的粗分隔线 */
  .cell[data-c="2"], .cell[data-c="5"] { border-right: 2px solid var(--grid-bold); }
  .cell[data-r="2"], .cell[data-r="5"] { border-bottom: 2px solid var(--grid-bold); }
  .cell.given { color: var(--given); font-weight: 800; }
  .cell.user { color: var(--user); }
  .cell.error { color: var(--error) !important; }
  .cell.related { background: var(--rel); }
  .cell.selected { background: var(--sel); }
  .cell.same { background: var(--same); }
  .cell.dup { background: var(--dup); }
  .cell .num { line-height: 1; z-index: 1; }
  .cell .notes {
    position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr); font-size: clamp(8px, 2.4vw, 11px);
    color: var(--note); font-weight: 500; pointer-events: none;
  }
  /* 笔记模式激活时，所有空格显示淡色边框，给用户明确的"现在在笔记模式"信号 */
  .notes-mode .cell:not(.given) { border-color: var(--accent); }
  /* 笔记状态下的格子比空格稍深一点，让用户一眼看出"这格有笔记" */
  .cell.has-notes:not(.given):not(.error) { background: rgba(148, 163, 184, 0.12); }
  .cell .notes span { display: flex; align-items: center; justify-content: center; }

  /* 行/列/宫完成奖励闪烁 */
  @keyframes lineFlash {
    0%   { box-shadow: inset 0 0 0 3px var(--accent), inset 0 0 22px rgba(37, 99, 235, .55); }
    50%  { box-shadow: inset 0 0 0 1px rgba(37, 99, 235, .35); }
    100% { box-shadow: inset 0 0 0 0 rgba(37, 99, 235, 0); }
  }
  .cell.flash { animation: lineFlash .45s ease-out 2; }

  .pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; margin-top: 10px; }
  .pad button {
    padding: 14px 0; border: none; border-radius: 10px; background: var(--btn);
    color: var(--btn-text); font-size: clamp(26px, 8vw, 40px); font-weight: 700; cursor: pointer;
    transition: opacity .3s ease, transform .3s ease;
  }
  .pad button:active { transform: scale(.96); }
  .pad button.done {
    opacity: 0; transform: scale(.7); pointer-events: none;
  }

  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tools button {
    flex: 1 1 30%; padding: 10px 4px; border: none; border-radius: 8px;
    background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); font-weight: 600;
  }
  .tools button.on { background: var(--accent); color: #fff; }
  .themes { display: flex; gap: 6px; margin-top: 8px; justify-content: center; }
  .themes button {
    padding: 6px 12px; border: 1px solid var(--grid-line); border-radius: 16px;
    background: var(--panel); color: var(--muted); font-size: 12px; cursor: pointer;
  }
  .themes button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--grid-bold); color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: 13px; max-width: 90%; text-align: center; opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal.show { display: flex; }
  .modal .box {
    background: var(--panel); color: var(--text); border-radius: 14px; padding: 22px;
    text-align: center; max-width: 320px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.2);
  }
  .modal .box h2 { margin: 0 0 8px; }
  .modal .box p { color: var(--muted); font-size: 14px; margin: 6px 0; }
  .modal .box button {
    margin: 8px 6px 0; padding: 10px 18px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .modal .box button.ghost { background: var(--btn); color: var(--btn-text); }

  /* Anna 提示弹窗特殊样式 */
  .modal.anna-mode .box {
    border: 2px solid var(--accent);
    box-shadow: 0 0 20px rgba(37, 99, 235, 0.3);
  }
  .modal.anna-mode .box h2 { color: var(--accent); }
  .modal.anna-mode .cta-section {
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid var(--grid-line);
    text-align: center;
  }
  .modal.anna-mode .cta-text {
    font-size: 13px; color: var(--muted);
    margin-bottom: 12px; line-height: 1.5;
  }
  .modal.anna-mode .cta-buttons {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  .modal.anna-mode .cta-btn {
    display: inline-block;
    padding: 12px 22px; border-radius: 24px;
    background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 700; cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    transition: transform .1s, box-shadow .1s;
  }
  .modal.anna-mode .cta-btn:active { transform: scale(.96); box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-area">
      <h1 id="gameTitle">Nine Grid</h1>
      <div class="sub" id="gameSub">Each puzzle has one solution</div>
    </div>
    <button class="lang-btn" id="langBtn">中文</button>
  </header>

  <div class="hud">
    <div class="stat">⏱ <b id="timer">00:00</b></div>
    <div class="stat" id="mistakesBox">🧠 <span data-i18n="mistakes">Attempts</span> <b id="mistakes">0</b></div>
    <div class="stat" id="diffLabel"><span data-i18n="difficulty">Difficulty</span> <b>Easy</b></div>
  </div>

  <div class="diffbar" id="diffbar"></div>

  <div class="board" id="board"></div>

  <div class="pad" id="pad"></div>

  <div class="tools">
    <button id="btnUndo">↩ <span data-i18n="undo">Undo</span></button>
    <button id="btnErase">⌫ <span data-i18n="erase">Erase</span></button>
    <button id="btnNotes">✍ <span data-i18n="notes">Notes</span></button>
    <button id="btnHint">💡 <span data-i18n="hint">Hint</span></button>
    <button id="btnAuto">🔍 <span data-i18n="autoCheck">Auto Check</span></button>
    <button id="btnNew">🆕 <span data-i18n="newGame">New Game</span></button>
  </div>

  <div class="themes" id="themes">
    <button data-theme="light">☀ <span data-i18n="light">Light</span></button>
    <button data-theme="night">🌑 <span data-i18n="night">Night</span></button>
    <button data-theme="dark">🌙 <span data-i18n="dark">Dark</span></button>
    <button data-theme="sepia">📜 <span data-i18n="sepia">Sepia</span></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="box">
    <h2 id="modalTitle"></h2>
    <p id="modalBody"></p>
    <div id="modalBtns"></div>
  </div>
</div>

<script src="sudoku-core.js"></script>
<script>
(function () {
  'use strict';
  const S = window.SudokuCore;
  const DIFF_LABELS = { fast: 'Fast', easy: 'Easy', medium: 'Medium', hard: 'Hard', expert: 'Expert', giant: 'Giant' };
  const SAVE_KEY = 'sudoku.save.v1';
  const LANG_KEY = 'sudoku.lang.v1';
  const HISTORY_CAP = 200;

  // ---------- i18n 翻译表 ----------
  const I18N = {
    en: {
      title: 'Nine Grid',
      sub: 'Each puzzle has one solution',
      mistakes: 'Attempts',
      difficulty: 'Difficulty',
      undo: 'Undo',
      erase: 'Erase',
      notes: 'Notes',
      hint: 'Hint',
      autoCheck: 'Auto Check',
      newGame: 'New Game',
      light: 'Light',
      night: 'Night',
      dark: 'Dark',
      sepia: 'Sepia',
      toastNotesOn: '✍ Notes mode ON (tap empty cells to toggle candidates)',
      toastNotesOff: '✍ Notes mode OFF',
      toastLang: 'Language: English',
      toastLoaded: 'Resumed previous game',
      winTitle: '🎉 Completed!',
      winBody: 'Difficulty: %d · Time: %t · Attempts: %m',
      winBtn: 'Play Again',
      threeMistakesTitle: '🤔 Ask Anna?',
      threeMistakesBody: 'Stuck? Anna can give you a hint!',
      askAnnaBtn: 'Ask Anna',
      askAnnaCTA: 'Want Anna to remember everything about you? Download her app!',
      downloadApp: 'Open Anna Memory',
      quitBtn: 'Give Up',
      gameOverTitle: '💀 Game Over',
      gameOverBody: 'Out of second chances. Try again!',
      gameOverBtn: 'New Game',
      noHistory: 'Nothing to undo',
      noHints: 'Board is complete',
      askAnnaGreeting: '💡 Anna says:',
      hintUnique: 'Hidden Single: Only %n can go here after elimination.',
      hintElimination: 'Elimination: This cell must be %n based on row/column/box.',
    },
    zh: {
      title: '九宫数独',
      sub: '每题唯一解',
      mistakes: '尝试',
      difficulty: '难度',
      undo: '撤销',
      erase: '橡皮擦',
      notes: '笔记',
      hint: '提示',
      autoCheck: '自动检查',
      newGame: '新游戏',
      light: '浅色',
      night: '夜间',
      dark: '深色',
      sepia: '护眼',
      toastNotesOn: '✍ 笔记模式已开启（空格可记候选数）',
      toastNotesOff: '✍ 笔记模式已关闭',
      toastLang: '语言：中文',
      toastLoaded: '已恢复上次未完成的对局',
      winTitle: '🎉 完成！',
      winBody: '难度：%d · 用时：%t · 尝试：%m 次',
      winBtn: '再来一局',
      threeMistakesTitle: '🤔 请教 Anna？',
      threeMistakesBody: '卡住了？让 Anna 给你一些提示吧！',
      askAnnaBtn: 'Ask Anna',
      askAnnaCTA: '想让 Anna 记住关于你的一切吗？下载她的 App！',
      downloadApp: '打开安娜记忆',
      quitBtn: '放弃，新游戏',
      gameOverTitle: '💀 游戏结束',
      gameOverBody: '容错已用完。正确率需要再练练～',
      gameOverBtn: '新游戏',
      noHistory: '没有可撤销的步骤',
      noHints: '盘面已正确，无需提示',
      askAnnaGreeting: '💡 Anna 说：',
      hintUnique: '唯一候选数法：这一格排除冲突后只剩 %n 一个可能值。',
      hintElimination: '排除法：观察所在行/列/宫已出现的数字，此格只能是 %n。',
    }
  };

  let lang = localStorage.getItem(LANG_KEY) || 'en';
  let state = null;
  let cellEls = [];
  let timerId = null;
  let padBtns = [];
  let lineDone = { rows: new Array(9).fill(false), cols: new Array(9).fill(false), boxes: new Array(9).fill(false) };

  function t(key) { return I18N[lang][key] || key; }

  function freshState(diff) {
    const { puzzle, solution } = S.generateByDifficulty(diff);
    return {
      difficulty: diff,
      puzzle: puzzle.slice(),
      solution: solution.slice(),
      grid: puzzle.slice(),            // 当前盘面（0=空）
      notes: Array.from({ length: 81 }, () => new Array(10).fill(false)),
      selected: -1,
      mistakes: 0,
      secondChanceUsed: false,
      autoCheck: false,
      notesMode: false,
      theme: document.documentElement.dataset.theme || 'light',
      elapsed: 0,
      running: true,
      history: []
    };
  }

  // ---------- 棋盘构建（一次） ----------
  function buildBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    cellEls = [];
    for (let i = 0; i < 81; i++) {
      const r = S.rowOf(i), c = S.colOf(i);
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.idx = i; cell.dataset.r = r; cell.dataset.c = c;
      const num = document.createElement('span'); num.className = 'num';
      const notes = document.createElement('div'); notes.className = 'notes';
      for (let k = 1; k <= 9; k++) {
        const s = document.createElement('span'); s.dataset.n = k; notes.appendChild(s);
      }
      cell.appendChild(num); cell.appendChild(notes);
      cell.addEventListener('click', () => selectCell(i));
      board.appendChild(cell);
      cellEls.push(cell);
    }
  }

  function buildPad() {
    const pad = document.getElementById('pad');
    pad.innerHTML = '';
    padBtns = [];
    for (let n = 1; n <= 9; n++) {
      const b = document.createElement('button');
      b.textContent = n;
      b.dataset.n = n;
      b.addEventListener('click', () => enterNumber(n));
      pad.appendChild(b);
      padBtns.push(b);
    }
  }

  function buildDiffBar() {
    const bar = document.getElementById('diffbar');
    bar.innerHTML = '';
    Object.keys(DIFF_LABELS).forEach((d) => {
      const b = document.createElement('button');
      b.textContent = DIFF_LABELS[d];
      b.dataset.diff = d;
      b.addEventListener('click', () => newGame(d));
      bar.appendChild(b);
    });
  }

  // ---------- 渲染 ----------
  function isDup(i) {
    const v = state.grid[i];
    if (v === 0) return false;
    const r = S.rowOf(i), c = S.colOf(i);
    for (let k = 0; k < 9; k++) {
      if ((r * 9 + k) !== i && state.grid[r * 9 + k] === v) return true;
      if ((k * 9 + c) !== i && state.grid[k * 9 + c] === v) return true;
    }
    const br = Math.floor(r / 3) * 3, bc = Math.floor(c / 3) * 3;
    for (let dr = 0; dr < 3; dr++) {
      for (let dc = 0; dc < 3; dc++) {
        const j = (br + dr) * 9 + (bc + dc);
        if (j !== i && state.grid[j] === v) return true;
      }
    }
    return false;
  }

  function applyLanguage() {
    document.documentElement.dataset.lang = lang;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = lang === 'zh' ? '九宫数独 · Sudoku' : 'Nine Grid · Sudoku';
    document.getElementById('gameTitle').textContent = t('title');
    document.getElementById('gameSub').textContent = t('sub');
    document.getElementById('langBtn').textContent = lang === 'en' ? '中文' : 'EN';
    // 更新所有 data-i18n 元素
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const key = el.dataset.i18n;
      if (I18N[lang][key]) el.textContent = I18N[lang][key];
    });
  }

  // ---------- 数字完成态 / 行·列·宫完成闪烁 ----------
  // 数字 n 是否已在盘面正确填满 9 个（solution 中所有 n 的位置都已填入）
  function isNumberComplete(n) {
    for (let i = 0; i < 81; i++) {
      if (state.solution[i] === n && state.grid[i] !== n) return false;
    }
    return true;
  }

  function refreshPad() {
    for (let n = 1; n <= 9; n++) {
      padBtns[n - 1].classList.toggle('done', isNumberComplete(n));
    }
  }

  function lineIndex(kind, idx, k) {
    if (kind === 'row') return idx * 9 + k;
    if (kind === 'col') return k * 9 + idx;
    const br = Math.floor(idx / 3) * 3, bc = (idx % 3) * 3;
    return (br + Math.floor(k / 3)) * 9 + (bc + (k % 3));
  }

  function isLineComplete(kind, idx) {
    for (let k = 0; k < 9; k++) {
      const i = lineIndex(kind, idx, k);
      if (state.grid[i] === 0 || state.grid[i] !== state.solution[i]) return false;
    }
    return true;
  }

  function flashLine(kind, idx) {
    for (let k = 0; k < 9; k++) {
      const el = cellEls[lineIndex(kind, idx, k)];
      el.classList.remove('flash');
      void el.offsetWidth; // 强制 reflow，允许连续重复触发动画
      el.classList.add('flash');
    }
  }

  // 全量重算 27 条线（9行+9列+9宫）的完成状态，仅在「新完成」时闪烁
  function refreshCompletions(flash = true) {
    for (let i = 0; i < 9; i++) {
      const r = isLineComplete('row', i);
      if (r && !lineDone.rows[i] && flash) flashLine('row', i);
      lineDone.rows[i] = r;
      const c = isLineComplete('col', i);
      if (c && !lineDone.cols[i] && flash) flashLine('col', i);
      lineDone.cols[i] = c;
      const b = isLineComplete('box', i);
      if (b && !lineDone.boxes[i] && flash) flashLine('box', i);
      lineDone.boxes[i] = b;
    }
  }

  function render() {
    const sel = state.selected;
    const selVal = sel >= 0 ? state.grid[sel] : 0;
    const inNotesMode = state.notesMode;
    // 笔记模式整体提示
    document.getElementById('board').classList.toggle('notes-mode', inNotesMode);
    for (let i = 0; i < 81; i++) {
      const cell = cellEls[i];
      const num = cell.firstChild;
      const notes = cell.lastChild;
      cell.className = 'cell';
      const given = state.puzzle[i] !== 0;
      const v = state.grid[i];
      const hasNotes = !given && state.notes[i].some((x) => x);

      if (given) {
        num.textContent = v; notes.style.display = 'none';
        cell.classList.add('given');
      } else if (v !== 0) {
        num.textContent = v; notes.style.display = 'none';
        cell.classList.add('user');
        if (state.autoCheck && v !== state.solution[i]) cell.classList.add('error');
      } else {
        num.textContent = '';
        const ns = state.notes[i];
        let any = false;
        notes.querySelectorAll('span').forEach((s) => {
          const n = +s.dataset.n;
          if (ns[n]) { s.textContent = n; s.style.visibility = 'visible'; any = true; }
          else { s.textContent = ''; s.style.visibility = 'hidden'; }
        });
        notes.style.display = any ? 'grid' : 'none';
        if (any) cell.classList.add('has-notes');
      }

      // 高亮层
      if (sel >= 0) {
        if (i === sel) cell.classList.add('selected');
        if (i !== sel && (S.rowOf(i) === S.rowOf(sel) || S.colOf(i) === S.colOf(sel) || S.boxOf(i) === S.boxOf(sel)))
          cell.classList.add('related');
        if (selVal !== 0 && v === selVal && i !== sel) cell.classList.add('same');
      }
      // 重复高亮（始终开启，对应 sudoku.com "Highlight duplicates"）
      if (!given && v !== 0 && isDup(i)) cell.classList.add('dup');
    }

    document.getElementById('timer').textContent = fmtTime(state.elapsed);
    document.getElementById('mistakes').textContent = state.mistakes;
    document.getElementById('diffLabel').innerHTML =
      '<span data-i18n="difficulty">' + t('difficulty') + '</span> <b>' + DIFF_LABELS[state.difficulty] + '</b>';
    Array.from(document.getElementById('diffbar').children).forEach((b) =>
      b.classList.toggle('active', b.dataset.diff === state.difficulty));
    document.getElementById('btnNotes').classList.toggle('on', state.notesMode);
    // 笔记模式激活时显示提示
    document.getElementById('btnNotes').innerHTML =
      (lang === 'zh' ? '✍ 笔记' : '✍ Notes') + (state.notesMode ? (lang === 'zh' ? ' ON' : ' ON') : '');
    document.getElementById('btnAuto').classList.toggle('on', state.autoCheck);
    document.getElementById('btnAuto').innerHTML =
      (lang === 'zh' ? '🔍 自动' : '🔍 Auto') + (state.autoCheck ? (lang === 'zh' ? ' ✓' : ' ✓') : '');
    Array.from(document.getElementById('themes').children).forEach((b) =>
      b.classList.toggle('on', b.dataset.theme === state.theme));
    refreshPad();
  }

  function fmtTime(s) {
    const m = Math.floor(s / 60), sec = s % 60;
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  // ---------- 计时 ----------
  function startTimer() {
    stopTimer();
    timerId = setInterval(() => {
      if (state && state.running) { state.elapsed++; render(); save(); }
    }, 1000);
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  // ---------- 交互 ----------
  function selectCell(i) { state.selected = i; render(); }

  function pushHistory() {
    state.history.push({ grid: state.grid.slice(), notes: state.notes.map((a) => a.slice()), mistakes: state.mistakes });
    if (state.history.length > HISTORY_CAP) state.history.shift();
  }

  function clearPeersNotes(idx, n) {
    const r = S.rowOf(idx), c = S.colOf(idx);
    const mark = (j) => { if (j !== idx && state.grid[j] === 0) state.notes[j][n] = false; };
    for (let k = 0; k < 9; k++) { mark(r * 9 + k); mark(k * 9 + c); }
    const br = Math.floor(r / 3) * 3, bc = Math.floor(c / 3) * 3;
    for (let dr = 0; dr < 3; dr++) for (let dc = 0; dc < 3; dc++) mark((br + dr) * 9 + (bc + dc));
  }

  function enterNumber(n) {
    const i = state.selected;
    if (i < 0 || state.puzzle[i] !== 0 || !state.running) return;

    if (state.notesMode) {
      if (state.grid[i] !== 0) return; // 笔记只对空格有效
      pushHistory();
      state.notes[i][n] = !state.notes[i][n];
      render(); save();
      return;
    }

    pushHistory();
    if (n === state.solution[i]) {
      state.grid[i] = n;
      state.notes[i] = new Array(10).fill(false);
      clearPeersNotes(i, n); // 笔记自动更新
      render(); save();
      refreshCompletions();
      checkWin();
    } else {
      state.grid[i] = n; // 保留玩家输入，便于擦除
      state.notes[i] = new Array(10).fill(false);
      state.mistakes++;
      render(); save();
      refreshCompletions();
      // 当尝试次数达到 3 次，触发 "Ask Anna" 机制
      if (state.mistakes >= 3) askAnnaHint();
    }
  }

  function eraseCell() {
    const i = state.selected;
    if (i < 0 || state.puzzle[i] !== 0 || !state.running) return;
    if (state.grid[i] === 0 && !state.notes[i].some((x) => x)) return;
    pushHistory();
    state.grid[i] = 0;
    state.notes[i] = new Array(10).fill(false);
    render(); save();
    refreshCompletions();
  }

  function undo() {
    if (!state.history.length) { toast(t('noHistory')); return; }
    const h = state.history.pop();
    state.grid = h.grid; state.notes = h.notes; state.mistakes = h.mistakes;
    render(); save();
    refreshCompletions();
  }

  function useHint() {
    let i = state.selected;
    if (i < 0 || state.puzzle[i] !== 0 || !state.running) {
      // 没选空格则自动挑第一个空/错格
      i = state.grid.findIndex((v, k) => state.puzzle[k] === 0 && v !== state.solution[k]);
      if (i < 0) { toast(t('noHints')); return; }
      state.selected = i;
    }
    const correct = state.solution[i];
    const cands = S.candidates(state.grid, i);
    let msg;
    if (cands.length === 1) msg = t('hintUnique').replace('%n', correct);
    else msg = t('hintElimination').replace('%n', correct);
    pushHistory();
    state.grid[i] = correct;
    state.notes[i] = new Array(10).fill(false);
    clearPeersNotes(i, correct);
    render(); save();
    refreshCompletions();
    toast(t('askAnnaGreeting') + ' ' + msg);
    checkWin();
  }

  // ---------- Ask Anna 机制 ----------
  // 当玩家尝试次数达到 3 次，Anna 主动给出智能提示
  function askAnnaHint() {
    // 找一个最优提示位置（优先选只有唯一候选数的格子）
    let bestCell = -1, bestCands = [];
    for (let i = 0; i < 81; i++) {
      if (state.puzzle[i] !== 0 || state.grid[i] !== 0) continue;
      const cands = S.candidates(state.grid, i);
      if (cands.length === 1) {
        bestCell = i;
        bestCands = cands;
        break; // 找到唯一候选数格，直接退出
      }
      if (cands.length < bestCands.length && cands.length > 0) {
        bestCell = i;
        bestCands = cands;
      }
    }

    if (bestCell < 0) {
      // 盘面已满，可能已完成
      checkWin();
      return;
    }

    const correct = state.solution[bestCell];
    const cands = S.candidates(state.grid, bestCell);

    // Anna 的智能提示文案
    let annaMsg;
    if (cands.length === 1) {
      annaMsg = lang === 'zh'
        ? `我发现这一格（第${Math.floor(bestCell/9)+1}行第${bestCell%9+1}列）只有一个候选数 ${correct}，试试填入吧！`
        : `I found a cell (row ${Math.floor(bestCell/9)+1}, col ${bestCell%9+1}) with only one candidate: ${correct}. Try it!`;
    } else {
      annaMsg = lang === 'zh'
        ? `我在观察第${Math.floor(bestCell/9)+1}行第${bestCell%9+1}列，这里应该是 ${correct}。你可以用排除法验证一下。`
        : `I'm looking at row ${Math.floor(bestCell/9)+1}, col ${bestCell%9+1}. The answer should be ${correct}. You can verify with elimination.`;
    }

    // 弹出示意弹窗，不自动填入
    showModal(t('threeMistakesTitle'), annaMsg, [
      { label: lang === 'zh' ? '知道了！' : 'Got it!', cb: () => hideModal() },
      { label: lang === 'zh' ? '直接填入' : 'Fill It', ghost: true, cb: () => {
        pushHistory();
        state.grid[bestCell] = correct;
        state.notes[bestCell] = new Array(10).fill(false);
        clearPeersNotes(bestCell, correct);
        render(); save();
        refreshCompletions();
        checkWin();
      }}
    ], true, true); // Anna 模式 + 带 CTA
  }

  function checkWin() {
    for (let i = 0; i < 81; i++) {
      if (state.grid[i] !== state.solution[i]) return;
    }
    state.running = false; stopTimer();
    clearSave();
    showModal(t('winTitle'), t('winBody')
      .replace('%d', DIFF_LABELS[state.difficulty])
      .replace('%t', fmtTime(state.elapsed))
      .replace('%m', state.mistakes),
      [{ label: t('winBtn'), cb: () => newGame(state.difficulty) }]
    );
  }

  // ---------- 存档 ----------
  function save() {
    try {
      const data = {
        difficulty: state.difficulty, puzzle: state.puzzle, solution: state.solution,
        grid: state.grid, notes: state.notes, mistakes: state.mistakes,
        secondChanceUsed: state.secondChanceUsed, autoCheck: state.autoCheck,
        notesMode: state.notesMode, theme: state.theme, elapsed: state.elapsed, running: state.running
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (e) { /* 隐私模式等可能不可用，忽略 */ }
  }
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || !d.puzzle || !d.solution) return null;
      // 校验载入盘面仍唯一解、且与存档解一致
      if (S.countSolutions(d.puzzle, 2) !== 1) return null;
      return d;
    } catch (e) { return null; }
  }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  // ---------- 弹窗 / Toast ----------
  function showModal(title, body, btns, isAnnaMode = false, withCTA = false) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').textContent = body;
    const wrap = document.getElementById('modalBtns');
    wrap.innerHTML = '';
    btns.forEach((b) => {
      const el = document.createElement('button');
      el.textContent = b.label;
      if (b.ghost) el.className = 'ghost';
      el.addEventListener('click', b.cb);
      wrap.appendChild(el);
    });
    // 添加 CTA 区域
    if (withCTA) {
      const ctaDiv = document.createElement('div');
      ctaDiv.className = 'cta-section';
      ctaDiv.innerHTML = `
        <p class="cta-text">${t('askAnnaCTA')}</p>
        <div class="cta-buttons">
          <a href="https://anna.net2global.com" target="_blank" rel="noopener" class="cta-btn">🌐 ${t('downloadApp')} →</a>
        </div>
      `;
      wrap.appendChild(ctaDiv);
    }
    const modal = document.getElementById('modal');
    modal.classList.toggle('anna-mode', isAnnaMode);
    modal.classList.add('show');
  }
  function hideModal() {
    const modal = document.getElementById('modal');
    modal.classList.remove('show', 'anna-mode');
  }

  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // ---------- 新游戏 ----------
  function newGame(diff) {
    hideModal();
    state = freshState(diff);
    lineDone = { rows: new Array(9).fill(false), cols: new Array(9).fill(false), boxes: new Array(9).fill(false) };
    applyTheme(state.theme);
    render();
    save();
    startTimer();
  }

  function applyLoaded(d) {
    state = {
      difficulty: d.difficulty, puzzle: d.puzzle, solution: d.solution, grid: d.grid,
      notes: d.notes, selected: -1, mistakes: d.mistakes, secondChanceUsed: d.secondChanceUsed,
      autoCheck: d.autoCheck, notesMode: d.notesMode, theme: d.theme, elapsed: d.elapsed,
      running: d.running !== false, history: []
    };
    applyTheme(d.theme || 'light');
    render();
    refreshCompletions(false); // 静默重建完成状态，载入时不闪烁
    if (state.running) startTimer(); else stopTimer();
  }

  // ---------- 主题 ----------
  const THEME_BG = { light: '#f3f4f6', dark: '#0f172a', night: '#000000', sepia: '#f5ecd7' };
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    const meta = document.getElementById('themeColorMeta');
    if (meta) meta.setAttribute('content', THEME_BG[theme] || THEME_BG.light);
  }
  function setTheme(t) {
    state.theme = t;
    applyTheme(t);
    render(); save();
  }

  // ---------- 语言切换 ----------
  function setLanguage(newLang) {
    lang = newLang;
    localStorage.setItem(LANG_KEY, lang);
    applyLanguage();
    render();
    toast(t('toastLang'));
  }

  // ---------- 键盘 ----------
  function onKey(e) {
    if (!state) return;
    if (e.key >= '1' && e.key <= '9') { enterNumber(+e.key); e.preventDefault(); return; }
    if (e.key === 'Backspace' || e.key === 'Delete') { eraseCell(); e.preventDefault(); return; }
    if (e.key === 'n' || e.key === 'N') {
      state.notesMode = !state.notesMode;
      toast(state.notesMode ? t('toastNotesOn') : t('toastNotesOff'));
      render(); save(); e.preventDefault(); return;
    }
    if (e.key === 'h' || e.key === 'H') { useHint(); e.preventDefault(); return; }
    if (e.key === 'u' || e.key === 'U') { undo(); e.preventDefault(); return; }
    const moves = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 };
    if (e.key in moves) {
      if (state.selected < 0) state.selected = 0;
      else state.selected = Math.max(0, Math.min(80, state.selected + moves[e.key]));
      render(); e.preventDefault();
    }
  }

  // ---------- 启动 ----------
  function init() {
    // 应用保存的语言偏好
    document.documentElement.dataset.lang = lang;
    applyLanguage();

    buildBoard(); buildPad(); buildDiffBar();
    document.getElementById('btnUndo').addEventListener('click', undo);
    document.getElementById('btnErase').addEventListener('click', eraseCell);
    document.getElementById('btnHint').addEventListener('click', useHint);
    document.getElementById('btnNew').addEventListener('click', () => newGame(state ? state.difficulty : 'easy'));
    document.getElementById('btnNotes').addEventListener('click', () => {
      state.notesMode = !state.notesMode;
      toast(state.notesMode ? t('toastNotesOn') : t('toastNotesOff'));
      render(); save();
    });
    document.getElementById('btnAuto').addEventListener('click', () => {
      state.autoCheck = !state.autoCheck; render(); save();
    });
    document.getElementById('themes').querySelectorAll('button').forEach((b) =>
      b.addEventListener('click', () => setTheme(b.dataset.theme)));
    document.getElementById('langBtn').addEventListener('click', () => {
      setLanguage(lang === 'en' ? 'zh' : 'en');
    });
    document.addEventListener('keydown', onKey);

    const saved = loadSave();
    if (saved) {
      applyLoaded(saved);
      toast(t('toastLoaded'));
    } else {
      newGame('easy');
    }

    // PWA：注册 Service Worker（离线可玩 + 可安装到主屏幕）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  }

  init();
})();
</script>
